<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSL Blockchain Explorer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>⛓️ DSL Blockchain Explorer</h1>
    <span id="tip">height: – </span>
  </header>

  <main>
    <section>
      <h2>State (active tip)</h2>
      <pre id="state">…</pre>
    </section>

    <section>
      <h2>Balances</h2>
      <table id="balances"><thead><tr><th>address</th><th>$COIN</th></tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>Validators <small>(signed vs paid)</small></h2>
      <table id="validators">
        <thead><tr><th>name</th><th>pubkey</th><th>signed</th><th>paid blocks</th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="quorum"></p>
    </section>

    <section>
      <h2>Pending candidates</h2>
      <table id="pending">
        <thead><tr><th>hash</th><th>height</th><th>signatures / quorum</th><th>finalized</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Branches (forks)</h2>
      <ul id="branches"></ul>
    </section>

    <section>
      <h2>Chain</h2>
      <div id="chain"></div>
    </section>
  </main>

  <footer>auto-refresh every 2s · pedagogical demo (not for production)</footer>
  <script src="/static/script.js"></script>
</body>
</html>
